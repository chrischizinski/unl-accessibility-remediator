services:
  accessibility-remediator:
    build: ./accessibility_remediator
    ports:
      - "${WEB_PORT:-8001}:8000"
    volumes:
      - ./input:/app/input
      - ./output:/app/output  
      - ./reports:/app/reports
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      - ollama
    command: ["python", "web/server.py"]

  ollama:
    image: ollama/ollama:0.1.41
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODELS=/root/.ollama/models

volumes:
  ollama_data:
